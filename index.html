<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Family Memories</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf1ea;--ink:#4a2b33;--rose:#c2576b;--gold:#c99a4b;--card:#fffaf6;--shadow:rgba(74,43,51,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1217;--ink:#f6e3e0;--rose:#e58a9b;--gold:#e0b46a;--card:#2c1b22;--shadow:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#1d1217;--ink:#f6e3e0;--rose:#e58a9b;--gold:#e0b46a;--card:#2c1b22;--shadow:rgba(0,0,0,.6)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 20% 0,rgba(194,87,107,.18),transparent 45%),radial-gradient(circle at 90% 30%,rgba(201,154,75,.18),transparent 40%),var(--bg);color:var(--ink);font-family:'Playfair Display',Georgia,serif;min-height:100vh}
header{text-align:center;padding:44px 16px 10px}
h1{font-size:clamp(2rem,7vw,3.6rem);margin:0;font-weight:600}
h1 em{color:var(--rose);font-weight:400}
.sub{font-family:'Caveat',cursive,sans-serif;font-size:1.5rem;color:var(--gold);margin:6px 0 0}
.heart{display:block;margin:14px auto 0;width:140px;height:14px;background:linear-gradient(90deg,transparent,var(--gold),transparent);height:1px;position:relative}
.heart:after{content:"♥";position:absolute;left:50%;top:-12px;transform:translateX(-50%);color:var(--rose);background:var(--bg);padding:0 8px}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:22px 12px 6px}
nav button,.add{font:inherit;border:1px solid var(--rose);color:var(--rose);background:transparent;border-radius:999px;padding:8px 18px;cursor:pointer;transition:.2s}
nav button.on,.add{background:var(--rose);color:#fff}
.add{display:inline-block;font-size:1rem}
.bar{text-align:center;padding:10px}
.wall{max-width:1100px;margin:0 auto;padding:20px 14px 70px;display:flex;flex-wrap:wrap;gap:26px;justify-content:center}
.pol{background:var(--card);padding:12px 12px 14px;width:230px;box-shadow:0 10px 24px var(--shadow);transform:rotate(var(--r));transition:.3s;cursor:pointer;position:relative}
.pol:nth-child(3n){--r:2.5deg}.pol:nth-child(3n+1){--r:-2deg}.pol:nth-child(3n+2){--r:1deg}
.pol:hover{transform:rotate(0) scale(1.06) translateY(-4px);z-index:2}
.pol img{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:2px}
.cap{font-family:'Caveat',cursive,sans-serif;font-size:1.35rem;text-align:center;margin-top:8px;min-height:1.6em}
.tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-3deg);background:rgba(201,154,75,.55);width:70px;height:20px}
.pol .x{position:absolute;right:6px;top:4px;border:0;background:none;color:var(--rose);font-size:1.3rem;cursor:pointer;opacity:0}
.pol:hover .x{opacity:1}
.empty{text-align:center;font-style:italic;opacity:.7;padding:50px 20px;width:100%}
dialog{border:0;background:transparent;max-width:92vw;padding:0}
dialog::backdrop{background:rgba(20,8,12,.85)}
dialog img{max-width:90vw;max-height:80vh;border:10px solid var(--card);box-shadow:0 20px 60px #000}
dialog p{font-family:'Caveat',cursive;color:#fff;font-size:1.8rem;text-align:center;margin:8px}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.petals i{position:absolute;top:-20px;color:var(--rose);opacity:.35;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
header,nav,.bar,.wall{position:relative;z-index:1}
@media(prefers-reduced-motion:reduce){.petals{display:none}}
</style><style>#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center}#login form{background:var(--card);padding:28px;border-radius:12px;box-shadow:0 10px 30px var(--shadow);width:min(92vw,340px);text-align:center}#login input{width:100%;margin:8px 0;padding:10px;border:1px solid var(--rose);border-radius:8px;font:inherit;background:transparent;color:var(--ink)}#login button{font:inherit;background:var(--rose);color:#fff;border:0;border-radius:999px;padding:10px 24px;cursor:pointer;margin-top:8px}#err{color:var(--rose);min-height:1.2em}#out{position:fixed;right:12px;top:calc(8px + env(safe-area-inset-top,0px));z-index:5;font:inherit;background:none;border:0;color:var(--rose);cursor:pointer}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head><body>
<div class="petals" id="petals"></div>
<header><h1>Our <em>Little World</em></h1><p class="sub">Me, my love, and our daughters</p><span class="heart"></span></header>
<nav id="nav"></nav>
<div class="bar"><label class="add">＋ Add photos<input id="file" type="file" accept="image/*" multiple hidden></label></div>
<main class="wall" id="wall"></main>
<dialog id="dlg"><img id="big" alt=""><p id="bigcap"></p></dialog>
<div id="login"><form id="lf"><h2>Our Little World ♥</h2><p>Family login</p><input id="em" type="email" placeholder="Email" required><input id="pw" type="password" placeholder="Password" required><div id="err"></div><button>Enter</button></form></div><button id="out" hidden>Log out</button>
<script>
var SUPABASE_URL="https://wibbgoxwdnjsicdtwsag.supabase.co",SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndpYmJnb3h3ZG5qc2ljZHR3c2FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4NTU5MzAsImV4cCI6MjEwOTQzMTkzMH0.KK2K7PVhcCK8EJeWl2lT_mtdkGWDIm5VITWx-1zvYIc";
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),ALBUMS=["All","Us Two","My Wife","Our Daughters","Family"],cur="All";
function $(i){return document.getElementById(i)}
function shrink(f){return new Promise(function(res){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var s=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(res,"image/jpeg",.85)};i.src=r.result};r.readAsDataURL(f)})}
function nav(){var n=$("nav");n.innerHTML="";ALBUMS.forEach(function(a){var b=document.createElement("button");b.textContent=a;if(a===cur)b.className="on";b.onclick=function(){cur=a;nav();render()};n.appendChild(b)})}
async function render(){var w=$("wall"),q=sb.from("photos").select("*").order("created_at",{ascending:false});if(cur!=="All")q=q.eq("album",cur);
var r=await q;w.innerHTML="";if(r.error){w.innerHTML='<div class="empty">Could not load photos.</div>';return}
var rows=r.data;if(!rows.length){w.innerHTML='<div class="empty">No memories here yet — tap “Add photos” to pin the first one ♥</div>';return}
var s=await sb.storage.from("photos").createSignedUrls(rows.map(function(p){return p.path}),3600),urls={};(s.data||[]).forEach(function(u){urls[u.path]=u.signedUrl});
rows.forEach(function(p){var d=document.createElement("div");d.className="pol";d.innerHTML='<span class="tag"></span><button class="x" title="Remove">×</button><img alt=""><div class="cap"></div>';d.querySelector("img").src=urls[p.path]||"";d.querySelector(".cap").textContent=p.caption||"";
d.onclick=function(){$("big").src=urls[p.path];$("bigcap").textContent=p.caption||"";$("dlg").showModal()};
d.querySelector(".x").onclick=async function(e){e.stopPropagation();if(confirm("Remove this photo for everyone?")){await sb.storage.from("photos").remove([p.path]);await sb.from("photos").delete().eq("id",p.id);render()}};w.appendChild(d)})}
$("dlg").onclick=function(){this.close()};
$("file").onchange=async function(e){var fs=[].slice.call(e.target.files),a=cur==="All"?"Family":cur;
for(var i=0;i<fs.length;i++){var c=prompt("Caption for "+fs[i].name+" (optional)","")||"",b=await shrink(fs[i]),path=(crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+i)+".jpg";
var u=await sb.storage.from("photos").upload(path,b,{contentType:"image/jpeg"});if(u.error){alert("Upload failed: "+u.error.message);continue}
await sb.from("photos").insert({path:path,caption:c,album:a})}
e.target.value="";render()};
function show(on){$("login").style.display=on?"none":"flex";$("out").hidden=!on;if(on){nav();render()}}
$("lf").onsubmit=async function(e){e.preventDefault();var r=await sb.auth.signInWithPassword({email:$("em").value,password:$("pw").value});if(r.error)$("err").textContent="Wrong email or password";else show(true)};
$("out").onclick=async function(){await sb.auth.signOut();show(false)};
(function(){var p=$("petals");for(var i=0;i<14;i++){var s=document.createElement("i");s.textContent="♥";s.style.left=Math.random()*100+"%";s.style.fontSize=10+Math.random()*14+"px";s.style.animationDuration=12+Math.random()*14+"s";s.style.animationDelay=-Math.random()*20+"s";p.appendChild(s)}})();
sb.auth.getSession().then(function(r){show(!!r.data.session)});
</script></body></html>
